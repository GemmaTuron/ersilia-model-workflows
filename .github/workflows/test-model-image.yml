name: Test model image

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      runner:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
    outputs:
      retag-success:
        description: "Whether retag-image succeeded"
        value: ${{ jobs.retag-image.outputs.status }}

jobs:
  test-image-amd64:
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    outputs:
      passed: ${{ steps.check-result.outcome }}
      arm64-in-dev: ${{ steps.dev-platforms.outputs.arm64 }}
    steps:
      # When the arm64 build failed, :dev holds amd64 only and :dev-arm64 still
      # holds an older build, which must not be tested or published
      - name: Check whether the dev image holds an arm64 build
        id: dev-platforms
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          ARCHS=$(docker buildx imagetools inspect --raw "ersiliaos/$MODEL_ID:dev" | jq -r '[.manifests[]?.platform.architecture] | join(" ")')
          echo "Architectures in ersiliaos/$MODEL_ID:dev: $ARCHS"
          if [[ " $ARCHS " == *" arm64 "* ]]; then
            echo "arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "arm64=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: "3.12"
          auto-activate-base: false
          activate-environment: test

      - name: Install dependencies
        run: |
          conda run -n test python -m pip install "ersilia[test] @ git+https://github.com/ersilia-os/ersilia.git"

      - name: Test AMD64 image
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          conda run --no-capture-output -n test bash -c "
            ersilia -v test $MODEL_ID --deep --from_dockerhub --version dev-amd64 --permissive
          "
      
      - name: Rename test results JSON
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          TEST_JSON="${MODEL_ID}-test.json"

          if [[ ! -f "$TEST_JSON" ]]; then
            echo "Error: Test results file $TEST_JSON not found!"
            exit 1
          fi

          mv "$TEST_JSON" "${MODEL_ID}-test-amd64.json"
          echo "TEST_JSON_AMD64=${MODEL_ID}-test-amd64.json" >> "$GITHUB_ENV"

      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-amd64
          path: ${{ env.TEST_JSON_AMD64 }}

      - name: Parse test results
        id: check-result
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          TEST_JSON="${MODEL_ID}-test-amd64.json"
          echo "Parsing test results from $TEST_JSON"

          TEST_FAILED=$(jq 'recurse | objects | select(map(select(. == false)) | length > 0)' "$TEST_JSON")
          if [[ -n "$TEST_FAILED" ]]; then
            echo "Some tests failed. Stopping workflow."
            exit 1
          fi

  test-image-arm64:
    runs-on: default-linux-arm64
    needs: test-image-amd64
    # amd64 is required: if it failed, the model is not released and arm64 is
    # not tested. arm64 is only tested when this build produced an arm64 image.
    if: ${{ always() && needs.test-image-amd64.outputs.passed == 'success' && needs.test-image-amd64.outputs.arm64-in-dev == 'true' }}
    continue-on-error: true
    outputs:
      passed: ${{ steps.check-result.outcome }}
    steps:      
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
    
      - name: print architecture
        run: |
          echo "Architecture: $(uname -m)"
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          auto-activate-base: false
          activate-environment: test 

      - name: Install dependencies
        run: |
          conda run -n test python -m pip install "ersilia[test] @ git+https://github.com/ersilia-os/ersilia.git"
          conda run -n test ersilia --version
          conda run -n test python --version

      - name: Test ARM64 image
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          conda run --no-capture-output -n test bash -c "
            ersilia -v test $MODEL_ID --deep --from_dockerhub --version dev-arm64 --permissive
          "

      - name: Rename test results JSON
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          TEST_JSON="${MODEL_ID}-test.json"

          if [[ ! -f "$TEST_JSON" ]]; then
            echo "Error: Test results file $TEST_JSON not found!"
            exit 1
          fi

          mv "$TEST_JSON" "${MODEL_ID}-test-arm64.json"
          echo "TEST_JSON_ARM64=${MODEL_ID}-test-arm64.json" >> "$GITHUB_ENV"

      - name: Upload logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report-arm64
          path: ${{ env.TEST_JSON_ARM64 }}

      - name: Parse test results
        id: check-result
        env:
          MODEL_ID: ${{ inputs.repo_name }}
        run: |
          TEST_JSON="${MODEL_ID}-test-arm64.json"
          echo "Parsing test results from $TEST_JSON"

          TEST_FAILED=$(jq 'recurse | objects | select(map(select(. == false)) | length > 0)' "$TEST_JSON")
          if [[ -n "$TEST_FAILED" ]]; then
            echo "Some tests failed. Stopping workflow."
            exit 1
          fi
      
  retag-image:
    runs-on: ${{ inputs.runner }}
    needs: [test-image-amd64, test-image-arm64]
    if: always()
    outputs:
      status: ${{ steps.retag-step.outcome }}
    steps:
      - name: Check if AMD successful
        if: ${{ needs.test-image-amd64.outputs.passed == 'success' }}
        run: |
          echo "AMD64" > amd.txt
      
      - name: Check if ARM successful
        if: ${{ needs.test-image-arm64.outputs.passed == 'success' }}
        run: |
          echo "ARM64" > arm.txt
      
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Check architecture information
        id: retag-step
        env:
          MODEL: ${{ github.event.repository.name }}
        run: |
          # amd64 must pass. latest holds arm64 only when arm64 passed too, so
          # Docker Architecture matches what users pull.
          if [[ -f amd.txt && -f arm.txt ]]; then
            SOURCE="ersiliaos/$MODEL:dev"
            echo "amd64 and arm64 passed: tagging dev (both architectures) as latest"
          elif [[ -f amd.txt ]]; then
            SOURCE="ersiliaos/$MODEL:dev-amd64"
            echo "Only amd64 passed: tagging dev-amd64 (amd64 only) as latest"
          else
            echo "The amd64 image test failed: keeping the current latest"
            exit 1
          fi
          docker buildx imagetools create \
            --tag ersiliaos/$MODEL:$(date +%Y-%m-%d) \
            --tag ersiliaos/$MODEL:latest \
            "$SOURCE"
          docker buildx imagetools inspect ersiliaos/$MODEL:latest

      - name: Determine Architecture and Save to arch.txt
        run: |
          ARCH=""
          if [[ -f amd.txt ]]; then
            ARCH="AMD64"
          fi
          if [[ -f arm.txt ]]; then
            if [[ -n "$ARCH" ]]; then
              ARCH="$ARCH,ARM64"
            else
              ARCH="ARM64"
            fi
          fi
          echo "$ARCH" > arch.txt
          cat arch.txt 

      - name: Upload Artifact Architecture
        uses: actions/upload-artifact@v4.5.0
        with:
          name: architecture
          path: arch.txt
