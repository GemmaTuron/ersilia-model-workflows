name: Upload ersilia pack dockerized model

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      runner:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true

jobs:
  build-ersilia-pack-image-amd64:
    runs-on: ${{ inputs.runner }}
    steps:
    
      - name: Checkout model repository
        uses: actions/checkout@v4
        with:
          repository: ersilia-os/${{ inputs.repo_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - run: git lfs pull

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Python for Ersilia Pack
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Download model checkpoints via eosvc (if listed in access.json)
        run: |
          # Only model/checkpoints is needed at inference. Never download model/framework/fit:
          # it holds training data, which may be private, and would be built into the image.
          if [ -f "access.json" ] && python -c "import json, sys; sys.exit(0 if 'checkpoints' in json.load(open('access.json')) else 1)"; then
            echo "access.json lists checkpoints. Installing eosvc and downloading model/checkpoints."
            pip install "eosvc>=1.3.0"
            eosvc download --path model/checkpoints
          else
            echo "No checkpoints in access.json. Skipping eosvc download."
          fi

      - name: Install ersilia-pack and generate the right Dockerfile
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            python -m pip install git+https://github.com/ersilia-os/ersilia-pack.git
            python -m pip install requests
            python -m pip install git+https://github.com/ersilia-os/ersilia.git

            wget -O resolve_dockerfile.py https://raw.githubusercontent.com/ersilia-os/ersilia-model-workflows/main/.github/scripts/resolve_dockerfile.py

            python resolve_dockerfile.py . ${{ inputs.repo_name }}

      - name: Build and push AMD64
        id: build_amd64
        uses: docker/build-push-action@v6.7.0
        timeout-minutes: 60
        with:
          context: ../
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ersiliaos/${{ inputs.repo_name }}:dev-amd64

  # amd64 is required; arm64 is optional. A failed or timed-out arm64 build must
  # not fail the run, so the image is still tested and released for amd64 only.
  # merge-multiarch reads the "built" output rather than this job's result,
  # because GitHub does not report a continue-on-error failure consistently.
  build-ersilia-pack-image-arm64:
    runs-on: default-linux-arm64
    continue-on-error: true
    outputs:
      built: ${{ steps.arm64-built.outputs.built }}
    steps:

      - name: Checkout model repository
        uses: actions/checkout@v4
        with:
          repository: ersilia-os/${{ inputs.repo_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - run: git lfs pull

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Python for Ersilia Pack
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Download model checkpoints via eosvc (if listed in access.json)
        run: |
          # Only model/checkpoints is needed at inference. Never download model/framework/fit:
          # it holds training data, which may be private, and would be built into the image.
          if [ -f "access.json" ] && python -c "import json, sys; sys.exit(0 if 'checkpoints' in json.load(open('access.json')) else 1)"; then
            echo "access.json lists checkpoints. Installing eosvc and downloading model/checkpoints."
            pip install "eosvc>=1.3.0"
            eosvc download --path model/checkpoints
          else
            echo "No checkpoints in access.json. Skipping eosvc download."
          fi

      - name: Install ersilia-pack and generate the right Dockerfile
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            python -m pip install git+https://github.com/ersilia-os/ersilia-pack.git
            python -m pip install requests
            python -m pip install git+https://github.com/ersilia-os/ersilia.git

            wget -O resolve_dockerfile.py https://raw.githubusercontent.com/ersilia-os/ersilia-model-workflows/main/.github/scripts/resolve_dockerfile.py

            python resolve_dockerfile.py . ${{ inputs.repo_name }}

      - name: Build and push ARM64
        id: build_arm64
        uses: docker/build-push-action@v6.7.0
        timeout-minutes: 60
        with:
          context: ../
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ersiliaos/${{ inputs.repo_name }}:dev-arm64

      - name: Record that the arm64 image was built
        id: arm64-built
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  merge-multiarch:
    # Runs only when amd64 built: an arm64-only image is never published
    if: ${{ always() && needs.build-ersilia-pack-image-amd64.result == 'success' }}
    needs: [build-ersilia-pack-image-amd64, build-ersilia-pack-image-arm64]
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # :dev-arm64 on Docker Hub may hold an older build when this run's arm64
      # build failed, so it is only used when it was built in this run
      - name: Create the dev image from the images built in this run
        env:
          MODEL: ${{ inputs.repo_name }}
          ARM64_BUILT: ${{ needs.build-ersilia-pack-image-arm64.outputs.built }}
        run: |
          if [[ "$ARM64_BUILT" == "true" ]]; then
            echo "amd64 and arm64 built: dev holds both"
            docker buildx imagetools create -t ersiliaos/$MODEL:dev ersiliaos/$MODEL:dev-amd64 ersiliaos/$MODEL:dev-arm64
          else
            echo "Only amd64 built: dev holds amd64 only"
            docker buildx imagetools create -t ersiliaos/$MODEL:dev ersiliaos/$MODEL:dev-amd64
          fi
          docker buildx imagetools inspect ersiliaos/$MODEL:dev
